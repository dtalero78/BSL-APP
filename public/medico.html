<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Médico</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: #0066cc;
      color: white;
      padding: 20px;
      text-align: center;
    }
    .status {
      padding: 15px;
      text-align: center;
      background: white;
      border-bottom: 1px solid #ddd;
    }
    .status.online {
      background: #d4edda;
      color: #155724;
    }
    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow-y: auto;
    }
    .queue-section {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .queue-section h2 {
      color: #333;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .queue-count {
      background: #0066cc;
      color: white;
      padding: 2px 10px;
      border-radius: 15px;
      font-size: 14px;
    }
    .queue-empty {
      color: #666;
      text-align: center;
      padding: 30px;
    }
    .patient-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 8px;
      margin-bottom: 10px;
      border-left: 4px solid #0066cc;
    }
    .patient-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .patient-position {
      width: 35px;
      height: 35px;
      background: #0066cc;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    .patient-details h3 {
      color: #333;
      margin-bottom: 3px;
    }
    .patient-details span {
      color: #666;
      font-size: 13px;
    }
    .btn-atender {
      background: #28a745;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s;
    }
    .btn-atender:hover {
      background: #218838;
    }
    #video-container {
      display: none;
      width: 100%;
      max-width: 800px;
      height: auto;
      aspect-ratio: 4/3;
      margin: 0 auto;
      position: relative;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
    }
    #remote-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    #local-video {
      position: absolute;
      bottom: 80px;
      right: 20px;
      width: 150px;
      height: 112px;
      border-radius: 8px;
      object-fit: cover;
      border: 2px solid white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .end-call {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #dc3545;
      color: white;
      padding: 15px 40px;
      border: none;
      border-radius: 50px;
      font-size: 18px;
      cursor: pointer;
    }
    .end-call:hover {
      background: #c82333;
    }
    .info-bar {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .info-item {
      background: #e9ecef;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 14px;
    }
    .info-item.active {
      background: #d4edda;
      color: #155724;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🏥 Panel Médico</h1>
  </div>

  <div class="status" id="status">
    Conectando...
  </div>

  <div class="container" id="main-container">
    <div class="queue-section">
      <h2>
        📋 Cola de Espera
        <span class="queue-count" id="queue-count">0</span>
      </h2>
      <div id="queue-list">
        <div class="queue-empty">No hay pacientes esperando</div>
      </div>
    </div>

    <div class="info-bar">
      <div class="info-item" id="medicos-info">👨‍⚕️ Médicos conectados: 1</div>
      <div class="info-item active" id="mi-estado">✅ Tu estado: Disponible</div>
    </div>
  </div>

  <div id="video-container">
    <video id="remote-video" autoplay playsinline></video>
    <video id="local-video" autoplay muted playsinline></video>
    <button class="end-call" onclick="endCall()">Finalizar Llamada</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://sdk.twilio.com/js/video/releases/2.27.0/twilio-video.min.js"></script>
  <script>
    const socket = io();
    let currentRoom = null;
    let currentPatientId = null;

    socket.on('connect', () => {
      console.log('Conectado al servidor');
      socket.emit('soy-medico', { nombre: 'Dr. Principal' });
    });

    socket.on('conectado-como-medico', (data) => {
      const status = document.getElementById('status');
      status.textContent = '✅ Conectado - Disponible para atender';
      status.className = 'status online';
      if (data.medicosActivos) {
        document.getElementById('medicos-info').textContent = `👨‍⚕️ Médicos conectados: ${data.medicosActivos}`;
      }
    });

    socket.on('actualizar-cola', (cola) => {
      console.log('Cola actualizada:', cola);
      const queueList = document.getElementById('queue-list');
      const queueCount = document.getElementById('queue-count');

      queueCount.textContent = cola.length;

      if (cola.length === 0) {
        queueList.innerHTML = '<div class="queue-empty">No hay pacientes esperando</div>';
        return;
      }

      queueList.innerHTML = cola.map(paciente => `
        <div class="patient-card">
          <div class="patient-info">
            <div class="patient-position">${paciente.posicion}</div>
            <div class="patient-details">
              <h3>${paciente.nombre}</h3>
              <span>⏱️ Esperando: ${formatTime(paciente.esperando)}</span>
            </div>
          </div>
          <button class="btn-atender" onclick="atenderPaciente('${paciente.pacienteId}', '${paciente.nombre}')">
            Atender
          </button>
        </div>
      `).join('');

      // Sonido de notificación si hay pacientes nuevos
      if (cola.length > 0) {
        playNotificationSound();
      }
    });

    function formatTime(seconds) {
      if (seconds < 60) return `${seconds} seg`;
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins}m ${secs}s`;
    }

    async function atenderPaciente(pacienteId, nombre) {
      const roomName = 'room-' + Date.now();
      currentPatientId = pacienteId;

      document.getElementById('main-container').style.display = 'none';
      document.getElementById('video-container').style.display = 'block';
      document.getElementById('mi-estado').textContent = '🔴 Tu estado: En llamada';
      document.getElementById('mi-estado').className = 'info-item';

      socket.emit('medico-acepta', {
        pacienteId: pacienteId,
        roomName: roomName
      });

      await startVideo(roomName, 'medico');
    }

    async function startVideo(roomName, identity) {
      try {
        const response = await fetch('/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identity, room: roomName })
        });

        const data = await response.json();

        const room = await Twilio.Video.connect(data.token, {
          name: roomName,
          audio: true,
          video: {
            width: 640,
            height: 480,
            frameRate: 24
          },
          preferredVideoCodecs: ['H264'],
          bandwidthProfile: {
            video: {
              mode: 'collaboration',
              maxSubscriptionBitrate: 2500000,
              dominantSpeakerPriority: 'high',
              renderDimensions: {
                high: { width: 640, height: 480 },
                standard: { width: 320, height: 240 },
                low: { width: 160, height: 120 }
              }
            }
          },
          networkQuality: {
            local: 1,
            remote: 1
          }
        });

        currentRoom = room;

        // Local video
        const localVideo = document.getElementById('local-video');
        room.localParticipant.videoTracks.forEach(publication => {
          localVideo.srcObject = new MediaStream([publication.track.mediaStreamTrack]);
        });

        // Remote video
        room.participants.forEach(participantConnected);
        room.on('participantConnected', participantConnected);
        room.on('participantDisconnected', () => {
          endCall();
        });

      } catch (error) {
        console.error('Error:', error);
        alert('Error al conectar video: ' + error.message);
        endCall();
      }
    }

    function participantConnected(participant) {
      console.log('Participante conectado:', participant.identity);

      // Manejar tracks ya publicados
      participant.tracks.forEach(publication => {
        if (publication.isSubscribed && publication.track) {
          attachTrack(publication.track);
        }
        // También escuchar cuando el track se suscriba
        publication.on('subscribed', attachTrack);
        publication.on('unsubscribed', detachTrack);
      });

      // Escuchar nuevos tracks que se publiquen
      participant.on('trackSubscribed', attachTrack);
      participant.on('trackUnsubscribed', detachTrack);

      // También escuchar cuando se publican nuevos tracks
      participant.on('trackPublished', publication => {
        console.log('Track publicado:', publication.trackName);
        if (publication.isSubscribed && publication.track) {
          attachTrack(publication.track);
        }
        publication.on('subscribed', attachTrack);
      });
    }

    function attachTrack(track) {
      console.log('Adjuntando track:', track.kind, track.sid);
      if (track.kind === 'video') {
        const remoteVideo = document.getElementById('remote-video');
        remoteVideo.srcObject = new MediaStream([track.mediaStreamTrack]);
        console.log('Video remoto adjuntado correctamente');
      } else if (track.kind === 'audio') {
        // Crear elemento de audio para el audio remoto
        const audioElement = document.createElement('audio');
        audioElement.id = 'remote-audio-' + track.sid;
        audioElement.autoplay = true;
        audioElement.srcObject = new MediaStream([track.mediaStreamTrack]);
        document.body.appendChild(audioElement);
        console.log('Audio remoto adjuntado correctamente');
      }
    }

    function detachTrack(track) {
      console.log('Desadjuntando track:', track.kind, track.sid);
      if (track.kind === 'audio') {
        const audioElement = document.getElementById('remote-audio-' + track.sid);
        if (audioElement) {
          audioElement.remove();
        }
      }
    }

    function endCall() {
      if (currentRoom) {
        currentRoom.disconnect();
        currentRoom = null;
      }

      // Notificar al servidor que terminó la llamada
      socket.emit('llamada-terminada');

      document.getElementById('video-container').style.display = 'none';
      document.getElementById('main-container').style.display = 'block';
      document.getElementById('mi-estado').textContent = '✅ Tu estado: Disponible';
      document.getElementById('mi-estado').className = 'info-item active';
      currentPatientId = null;
    }

    function playNotificationSound() {
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();

      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);

      oscillator.frequency.value = 800;
      oscillator.type = 'sine';
      gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);

      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + 0.2);
    }

    // Actualizar tiempo de espera cada 10 segundos
    setInterval(() => {
      socket.emit('solicitar-cola');
    }, 10000);
  </script>
</body>
</html>
